bind 0.0.0.0
protected-mode yes
port 6379
timeout 0
tcp-keepalive 60

databases 16

appendonly yes
appendfsync everysec

save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

maxmemory-policy allkeys-lru

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
