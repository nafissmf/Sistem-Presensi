# Salin ke global_nginx_proxy: /etc/nginx/conf.d/rakernas.conf
# Gateway join jaringan app-bridge. Aplikasi tidak membuka port 80/443.
# X-Forwarded-Proto mengikuti TLS/Cloudflare, tidak ditimpa $scheme listen 80.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $rakernas_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream rakernas_api {
    server rakernas-api-prod:8000;
    keepalive 8;
}

upstream rakernas_ui {
    server rakernas-ui-prod:80;
    keepalive 8;
}

server {
    listen 80;
    server_name rakernas.example.com;

    client_max_body_size 60M;
    large_client_header_buffers 8 64k;

    location /storage/ {
        proxy_pass http://minio:9000/rakernas-public-documents/;
        proxy_set_header Host minio;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $rakernas_forwarded_proto;
    }

    location /api/v1/ws/ {
        proxy_pass http://rakernas_api/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $rakernas_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location /api/v1/ {
        proxy_pass http://rakernas_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $rakernas_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://rakernas_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $rakernas_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
