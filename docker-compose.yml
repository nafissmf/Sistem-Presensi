name: rakernas

services:
  # --- CORE SERVICES ---
  # app_db:
  #   image: postgres:15-alpine  # Menggunakan PostgreSQL 15 (Alpine version lebih ringan)
  #   container_name: app_db
  #   restart: always
  #   ports:
  #     - "5434:5432"  # Expose host 5433 -> container 5432 (default postgres)
  #   env_file: .env
  #   environment:
  #     - TZ=Asia/Jakarta
  #     # PostgreSQL menggunakan variabel berikut:
  #     - POSTGRES_USER=${DB_USER}
  #     - POSTGRES_PASSWORD=${DB_PASSWORD}
  #     - POSTGRES_DB=${DB_NAME}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data  # Path data PostgreSQL berbeda dengan MySQL
  #   healthcheck:
  #     # Menggunakan pg_isready untuk memastikan database siap menerima koneksi
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - app-bridge

  adminer:
    image: adminer
    container_name: rakernas-adminer
    restart: always
    env_file: .env
    environment:
      ADMINER_DEFAULT_SERVER: ${DB_HOST:-mysql-container}
    networks:
      - app-bridge

  # --- BACKEND SERVICES ---
  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: ./builder/local/Dockerfile
    container_name: rakernas-api-dev
    volumes:
      - ./backend:/app
    env_file: .env  # Menyuntikkan SEMUA variabel .env (SECRET_KEY, dsb) ke dalam FastAPI
    environment:
      - REDIS_URL=${REDIS_URL:-redis://:sharedredis123@shared-redis:6378/1}
      - ENV=development
      - TZ=Asia/Jakarta
      - S3_ENABLED=${S3_ENABLED:-true}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-rakernas-documents}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-rakernas}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-change-me-rakernas-secret}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PUBLIC_BUCKET=${S3_PUBLIC_BUCKET:-rakernas-public-documents}
      - S3_PUBLIC_BROWSER_BASE_URL=${S3_PUBLIC_BROWSER_BASE_URL:-/storage}
    networks:
      - app-bridge

  backend-prod:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: ./builder/prod/Dockerfile
    container_name: rakernas-api-prod
    restart: always
    volumes:
      - backend_media_data:/app/uploads
    env_file: .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://:sharedredis123@shared-redis:6378/1}
      - ENV=production
      - TZ=Asia/Jakarta
      - S3_ENABLED=${S3_ENABLED:-true}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-rakernas-documents}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-rakernas}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-change-me-rakernas-secret}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PUBLIC_BUCKET=${S3_PUBLIC_BUCKET:-rakernas-public-documents}
      - S3_PUBLIC_BROWSER_BASE_URL=${S3_PUBLIC_BROWSER_BASE_URL:-/storage}
    networks:
      - app-bridge

  # --- FRONTEND SERVICES ---
  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: ./builder/local/Dockerfile
    container_name: rakernas-ui-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules # Mencegah konflik node_modules lokal & container (anonymous volume)
      - /app/.vite # Cache Vite untuk performa lebih baik
    ports:
      - "5300:5173" # Expose port langsung untuk akses langsung ke Vite dev server
    environment:
      # PENTING: Memaksa Vite/Chokidar mendeteksi perubahan file di Docker
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
      - VITE_HMR_PORT=${APP_PORT:-8082}
      # Optimasi Node.js untuk performa
      - NODE_OPTIONS=--max-old-space-size=4096
    env_file: .env
    # Healthcheck untuk memastikan container siap
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app-bridge
    # Restart policy untuk development
    restart: unless-stopped

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: ./builder/prod/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY}
    container_name: rakernas-ui-prod
    restart: always
    env_file: .env
    networks:
      - app-bridge

  # --- NGINX GATEWAY ---
  nginx-dev:
    profiles: ["dev"]
    build:
      context: ./nginx
      dockerfile: ./builder/local/Dockerfile
    container_name: rakernas-nginx-dev
    ports:
      - "${APP_PORT:-8082}:80"
    depends_on:
      frontend-dev:
        condition: service_healthy
      backend-dev:
        condition: service_started
    networks:
      - app-bridge

  # nginx-prod:
  #   profiles: ["prod"]
  #   build:
  #     context: ./nginx
  #     dockerfile: ./builder/prod/Dockerfile
  #   container_name: app_gateway_prod
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   restart: always
  #   depends_on:
  #     - frontend-prod
  #     - backend-prod
  #   networks:
  #     - app-bridge

networks:
  app-bridge:
    external: true
    name: app-bridge

volumes:
  backend_media_data:
