# Salin ke global-gateway conf.d (mis. /etc/nginx/conf.d/purchasing-go.conf).
# Pastikan gateway join jaringan Docker yang sama dengan stack app (app-bridge).
#
# Nama upstream mengikuti container_name di docker-compose.yml:
#   purchasing_go_adminer, purchasing_go_api_prod, purchasing_go_ui_prod
# Jika di server Anda memakai nama lain, sesuaikan blok upstream di bawah.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream purchasing_go_adminer_backend {
    server purchasing_go_adminer:8080;
}

upstream purchasing_go_minio_backend {
    server purchasing-go-minio:9000;
}

server {
    listen 80;
    server_name purchasing.ferxcode.my.id;

    client_max_body_size 50M;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;
    proxy_buffer_size 4k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Content-Security-Policy "
      default-src 'self';
      base-uri 'self';
      object-src 'none';
      frame-ancestors 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https:;
      font-src 'self' data:;
      connect-src 'self' https://challenges.cloudflare.com;
      frame-src 'self' https://challenges.cloudflare.com;
      worker-src 'self' blob:;
      trusted-types turnstile-policy;
      require-trusted-types-for 'script';
    " always;

    # --- 1. ADMINER (/dd/) — sama dengan nginx builder prod/local project ini ---
    location /dd/ {
        proxy_pass http://purchasing_go_adminer_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dd;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    location = /dd {
        return 301 $scheme://$host$request_uri/;
    }

    # --- 2. STATIC FILES (Uploads) ---
    location /uploads/ {
        proxy_pass http://purchasing_go_api_prod:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, immutable";

        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/svg+xml svg;
        }

        location ~* \.(php|pl|py|jsp|sh|cgi)$ {
            deny all;
        }
    }

    # --- 4. PUBLIC MINIO FILES via domain utama (/minio/...) ---
    # URL publik object menjadi: https://purchasing-go.example.com/minio/<bucket>/<object_key>
    location /minio/ {
        proxy_pass http://purchasing_go_minio_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /minio;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    # --- 5. BACKEND API (/api/v1/) ---
    location /api/v1/ {
        proxy_pass http://purchasing_go_api_prod:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/v1;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --- 6. FRONTEND (container nginx statis) ---
    location / {
        proxy_pass http://purchasing_go_ui_prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Content-Security-Policy;

        add_header Cache-Control "no-store, no-cache, must-revalidate";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
