map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP ke HTTPS
server {
    listen 80;
    server_name app.com; # Ganti dengan domain Anda
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.com;

    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;

    # Jalur Sertifikat SSL (Akan diisi oleh Certbot/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.com/privkey.pem;

    # Optimasi SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Frontend (Statik via Nginx Frontend Container)
    location / {
        proxy_pass http://frontend-prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Dashboard realtime — sama prefix dengan API
    location /api/v1/ws/ {
        proxy_pass http://backend-prod:8000/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # 2. Static Files (Uploads) - Must be before /api/v1/ to avoid conflicts
    location /uploads/ {
        proxy_pass http://backend-prod:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache static files
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Set correct content types
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/svg+xml svg;
        }
    }

    # 2.1. Backend API
    location /api/v1/ {
        proxy_pass http://backend-prod:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Adminer (Akses Terbatas)
    location /dd/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        # Tips: Tambahkan auth_basic di sini untuk keamanan extra
    }

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:;" always;
}